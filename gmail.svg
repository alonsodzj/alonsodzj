<svg xmlns="http://www.w3.org/2000/svg" width="120" height="70" viewBox="7 28 120 70">
  <style>
    .env{animation:bob 2.4s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(-2px)}}
    .dot{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-in-out infinite}
    @keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  </style>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset=".35" stop-color="#0A66C2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="matte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3135"/><stop offset="1" stop-color="#1b1d20"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/><stop offset=".5" stop-color="#f1f3f5"/><stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bandClip"><rect x="96" y="42" width="282" height="44" rx="8"/></clipPath>
  </defs>
  <rect x="9" y="30" width="116" height="66" rx="8" fill="url(#alu)"/>
  <rect x="11.5" y="32.5" width="111" height="61" rx="6" fill="url(#matte)"/>
  <g class="env">
    <rect x="44" y="49" width="46" height="32" rx="4" fill="none" stroke="#e3e6e9" stroke-width="2.4"/>
    <path d="M46 52 L67 67 L88 52" fill="none" stroke="#EA4335" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="90" cy="49" r="5" fill="#EA4335" stroke="#232528" stroke-width="2"/>
  </g>
</svg>
