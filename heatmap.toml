user = "alonsodzj"
lang = "en"
file = "leetcode-heatmap.svg"
page = "leetcode-heatmap.html"

[layout]
padding = 5
cell_size = 12
scale = 1.2

[cell]
hide_empty = true

[colors]
card_border = "none"
empty = "#1c1c1c"
levels = ["#0e4429", "#006d32", "#26a641", "#76ff03"]
today = "#76ff03"
title = "#f5f5f5"
text = "#969696"
accent = "#76b900"
page_background = "#none"

[font]
google = "Michroma"
google_weights = [400, 700]
title_google = "Michroma"
title_size = 13
title_weight = 700
subtitle_size = 10
letter_spacing = 0.3
uppercase_title = true

[weekdays]
show = false

[legend]
show = false
less = "-"
more = "+"

[animation]
type = "pop"
order = "diagonal"
loop = true
loop_pause = 1
animate_text = true
