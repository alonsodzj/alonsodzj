user = "alonsodzj"
lang = "en"
file = "leetcode-heatmap.svg"
page = "leetcode-heatmap.html"

[layout]
padding = 5
cell_size = 12
scale = 1.2

[cell]
hide_empty = true

[colors]
card_border = "none"
empty = "#1c1813"
levels = ["#4a2f05", "#7a4b06", "#c47a0a", "#ffa116"]
today = "#ffa116"
title = "#f5f0e8"
text = "#969696"
accent = "#ffa116"
page_background = "#none"

[font]
google = "Michroma"
google_weights = [400, 700]
title_google = "Michroma"
title_size = 13
title_weight = 700
subtitle_size = 10
letter_spacing = 0.3
uppercase_title = true

[weekdays]
show = false

[legend]
show = false
less = "-"
more = "+"

[animation]
type = "pop"
order = "diagonal"
loop = true
loop_pause = 3
animate_text = true
pulse_streak = true
pulse_speed = 1.6