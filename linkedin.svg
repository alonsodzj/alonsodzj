<svg xmlns="http://www.w3.org/2000/svg" width="120" height="70" viewBox="7 28 120 70">
  <style>
    .shine{animation:sweep 3.5s ease-in-out infinite}
    @keyframes sweep{0%,20%{transform:translateX(-120px)}70%,100%{transform:translateX(320px)}}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop 4s ease-out infinite both}
    @keyframes pop{0%,35%{opacity:0;transform:scale(.4)}45%,85%{opacity:1;transform:none}100%{opacity:0}}
    .link{stroke-dasharray:22;animation:draw 4s ease-out infinite both}
    @keyframes draw{0%,10%{stroke-dashoffset:22}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:22}}
  </style>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset=".35" stop-color="#0A66C2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="matte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3135"/><stop offset="1" stop-color="#1b1d20"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/><stop offset=".5" stop-color="#f1f3f5"/><stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bandClip"><rect x="96" y="42" width="282" height="44" rx="8"/></clipPath>
  </defs>
  <rect x="9" y="30" width="116" height="66" rx="8" fill="url(#alu)"/>
  <rect x="11.5" y="32.5" width="111" height="61" rx="6" fill="url(#matte)"/>
  <circle cx="34" cy="55" r="9" fill="#0A66C2"/>
  <circle cx="34" cy="52.5" r="3.4" fill="#e8eef5"/>
  <path d="M28.3 61.2 a6 5 0 0 1 11.4 0" fill="#e8eef5"/>
  <rect x="24" y="70" width="34" height="3" rx="1.5" fill="#9aa0a6"/>
  <rect x="24" y="77" width="24" height="3" rx="1.5" fill="#6b7178"/>
  <rect x="24" y="84" width="28" height="3" rx="1.5" fill="#6b7178"/>
  <path class="link" d="M45 55 H67" stroke="#0A66C2" stroke-width="2" stroke-linecap="round"/>
  <g class="pop">
    <circle cx="78" cy="55" r="9" fill="#3a3d42" stroke="#0A66C2" stroke-width="1.5"/>
    <circle cx="78" cy="52.5" r="3.4" fill="#9aa0a6"/>
    <path d="M72.3 61.2 a6 5 0 0 1 11.4 0" fill="#9aa0a6"/>
    <circle cx="104" cy="78" r="8" fill="#0A66C2"/>
    <path d="M104 74 V82 M100 78 H108" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
