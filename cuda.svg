<svg xmlns="http://www.w3.org/2000/svg" width="384" height="128" viewBox="0 0 384 128">
  <style>
    .fan{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .shine{animation:sweep 3.5s ease-in-out infinite}
    @keyframes sweep{0%,20%{transform:translateX(-120px)}70%,100%{transform:translateX(320px)}}
  </style>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset=".35" stop-color="#76B900" stop-opacity=".85"/>
      <stop offset="1" stop-color="#76B900"/>
    </linearGradient>
    <linearGradient id="matte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d52"/><stop offset=".45" stop-color="#34373b"/><stop offset="1" stop-color="#232528"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/><stop offset=".5" stop-color="#f1f3f5"/><stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bandClip"><rect x="96" y="42" width="282" height="44" rx="8"/></clipPath>
    <g id="fan">
      <circle r="13.5" fill="#1b1d20"/>
      <g fill="#2f3236"><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(0.0)"/><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(51.4)"/><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(102.9)"/><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(154.3)"/><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(205.7)"/><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(257.1)"/><path d="M0 0 C3 -6 9 -9 12.5 -5 C7 -4 3 -1.5 0 0Z" transform="rotate(308.6)"/></g>
      <circle r="4" fill="#3d4045"/>
    </g>
  </defs>

  <!-- banda verde difuminada -->
  <g clip-path="url(#bandClip)">
    <rect x="96" y="42" width="282" height="44" fill="url(#band)"/>
    <rect class="shine" x="96" y="42" width="60" height="44" fill="url(#gloss)"/>
  </g>
